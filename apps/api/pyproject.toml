[project]
name = "armie-construction-intelligence-workbench-api"
version = "0.1.0"
description = "ARMIE auditable multimodal construction intelligence reference implementation"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "eval-type-backport>=0.2,<1",
  "pydantic-settings>=2.3,<3",
  "langgraph>=0.2,<1",
  "langchain-core>=0.3,<1",
  "ifcopenshell>=0.8,<1",
  "pypdf>=5,<7",
  "PyMuPDF>=1.24,<2",
  "httpx>=0.27,<1",
  "openai>=1.0,<2",
  "python-multipart>=0.0.9,<1",
  "azure-identity>=1.17,<2",
  # azure.identity.aio's DefaultAzureCredential needs an async HTTP
  # transport; azure-core's default async transport requires aiohttp,
  # which is not pulled in automatically. Found live during SPEC-M3's
  # first real deployment: AzureOpenAIProvider failed with "aiohttp
  # package is not installed" the first time a Managed Identity token was
  # actually requested against a live Azure OpenAI resource -- the
  # client_factory test seam (tests/test_azure_openai_provider.py) never
  # exercises this real credential path, so it could not have caught this.
  "aiohttp>=3.9,<4",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-instrumentation-httpx>=0.48b0",
  "azure-monitor-opentelemetry-exporter>=1.0.0b30",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py39"
