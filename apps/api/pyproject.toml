[project]
name = "armie-construction-intelligence-workbench-api"
version = "0.1.0"
description = "ARMIE auditable multimodal construction intelligence reference implementation"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "eval-type-backport>=0.2,<1",
  "pydantic-settings>=2.3,<3",
  "langgraph>=0.2,<1",
  "langchain-core>=0.3,<1",
  "ifcopenshell>=0.8,<1",
  "pypdf>=5,<6",
  "PyMuPDF>=1.24,<2",
  "httpx>=0.27,<1",
  "openai>=1.0,<2",
  "python-multipart>=0.0.9,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py39"
