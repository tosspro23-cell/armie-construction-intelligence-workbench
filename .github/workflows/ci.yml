name: CI

on:
  push:
  pull_request:

# No Ollama, no model downloads, no secrets, no network egress beyond
# package registries (SPEC-M1 §4.8/21). Any test requiring a live model is
# out of scope for this milestone.
#
# The `postgres` service container below (SPEC-M4) is a documented,
# deliberate exception, not silently added: it runs as a plain sibling
# container on the runner's own localhost network -- once started, it makes
# no outbound network calls of its own -- and the owner explicitly decided
# pulling `postgres:16-alpine` from Docker Hub fits this policy's intent
# the same way pulling from PyPI/npm does, given GitHub Actions' own
# service-container images always come from a container registry, not an
# arbitrary network endpoint (docs/decisions/REVIEW_REQUIRED.md, resolved).
permissions:
  contents: read

jobs:
  backend:
    name: backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: armie
          POSTGRES_PASSWORD: armie
          POSTGRES_DB: armie
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Exercises PostgresConversationStore/PostgresAuditStore for real in
      # CI (SPEC-M4 §F) -- previously only ever checked by a developer
      # manually running `docker compose up postgres` locally, so CI never
      # actually verified the live-database path at all.
      TEST_DATABASE_URL: postgresql://armie:armie@localhost:5432/armie
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install apps/api
        run: pip install -e 'apps/api[dev]'
      - name: Apply Postgres schema migrations
        # Independent-review finding (P2 #9), confirmed live 2026-09-13:
        # this only ever applied 0001, so CI's own TEST_DATABASE_URL-
        # gated tests never actually exercised anything added by a later
        # migration -- confirmed the hard way, not just in principle:
        # tests/test_postgres_persistence.py's new SPEC-M9 thread_projects
        # tests (added in this same milestone's own P1 #1 fix) failed
        # CI outright with "relation thread_projects does not exist" the
        # moment they were pushed, exactly the gap this finding predicted.
        # 0002a/0002b are the real Azure production role's least-privilege
        # grants, not applicable to CI's own superuser `armie` role, so
        # they are deliberately not run here.
        run: |
          set -euo pipefail
          psql "$TEST_DATABASE_URL" -f apps/api/migrations/0001_conversations_and_audit_events.sql
          psql "$TEST_DATABASE_URL" -f apps/api/migrations/0003_thread_projects.sql
          psql "$TEST_DATABASE_URL" -f apps/api/migrations/0005_backfill_thread_projects_demo.sql
          # 0007 is the real Azure production role's least-privilege grant
          # (like 0002a/0002b/0004 before it), not applicable to CI's own
          # superuser `armie` role -- deliberately not run here. D-024
          # already fixed this exact "CI silently only ran 0001" gap once;
          # add every new migration here going forward, not just this one.
          psql "$TEST_DATABASE_URL" -f apps/api/migrations/0006_engineering_findings.sql
          psql "$TEST_DATABASE_URL" -f apps/api/migrations/0008_agent_proposal.sql
          psql "$TEST_DATABASE_URL" -f apps/api/migrations/0009_finding_entity_type.sql
      - name: Run backend test suite
        run: PYTHONPATH=apps/api python3 -m pytest -q

  frontend:
    name: frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies (no flags)
        run: npm ci
      - name: Build
        run: npm run build

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install -e 'apps/api[dev]'
      - name: "Ruff (blocking: F, E9, I, F401)"
        run: ruff check --select F,E9,I,F401 apps/api tests
      # BLE001 (blind except) stays advisory: those excepts sit on the
      # failure paths this milestone characterizes; fixing them before
      # F1-F12 exist inverts the order (SPEC-M1 OD-3). Never fails the job.
      - name: "Ruff (advisory: BLE001)"
        run: ruff check --select BLE001 apps/api tests || true
