name: Azure deploy (manual)

# SPEC-M3 §4G: manual-only (workflow_dispatch). Never on push to main --
# this repository's ongoing local development must not trigger cloud spend
# or a deployment on every commit. Bootstrap order matches the split
# between infra/bicep/platform.bicep and infra/bicep/apps.bicep: the
# registry has to exist before an image can be built into it, and the
# Container Apps need the built image tags as parameters.
on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: "Target Azure resource group (must already exist)"
        required: true
      azure_openai_account_name:
        description: "Name of an EXISTING Azure OpenAI account in that resource group (SPEC-M3 infra/bicep/platform.bicep is not authorized to create one -- see its header comment)"
        required: true
      azure_openai_text_deployment:
        description: "Name of an EXISTING model deployment on that account, for text interpretation. No default on purpose: an independent review found this workflow previously omitted this parameter entirely, letting Bicep's own default ('gpt-4o-mini') silently deploy against a model that did not exist on the real account -- the deployment 'succeeded' and nothing caught it until a real question was asked."
        required: true
      azure_openai_vision_deployment:
        description: "Name of an EXISTING model deployment on that account, for vision-grounded calls (can be the same value as the text deployment)."
        required: true
      name_prefix:
        description: "Short resource-name prefix (lowercase alphanumeric, 3-11 chars)"
        required: false
        default: "armiem3"
      image_tag:
        description: "Tag to build and deploy (blank = the triggering commit SHA)"
        required: false
        default: ""
      database_url:
        description: "SPEC-M4: postgresql:// DSN (no password -- AAD-only, OD-26) for the already-provisioned Postgres data tier, e.g. postgresql://<identityName>@<serverFqdn>:5432/armie?sslmode=require. Blank (the default) keeps the in-memory conversation store + local JSONL audit file, exactly like every deployment before this milestone. This workflow does NOT provision infra/bicep/data.bicep itself -- unlike Container Apps, a Postgres Flexible Server bills continuously once created (see that file's header), so creating it is a deliberate, separate `az deployment group create --template-file infra/bicep/data.bicep ...` run, not something a routine app deploy should trigger as a side effect. IMPORTANT: once you have deployed with a real value here, every later redeploy must repeat it -- leaving this blank on a later run does not leave persistence untouched, it turns it back off (see allow_disabling_persistence below, which this workflow requires if you actually mean to do that)."
        required: false
        default: ""
      allow_disabling_persistence:
        description: "Independent-review fix: leaving database_url blank on a redeploy of an API that currently has persistence enabled used to silently revert it to in-memory/JSONL mode, with no warning. This workflow now refuses that outright unless you set this to 'yes', confirming the downgrade is deliberate. Irrelevant (ignored) on a first deploy, or any deploy where database_url is set."
        required: false
        default: "no"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Phase 1 vertical slice
    runs-on: ubuntu-latest
    env:
      # Every workflow_dispatch input is threaded through job-level env vars
      # and referenced as a shell variable ($FOO) in every run: step below,
      # never as a raw ${{ inputs.* }} substitution inside a script body.
      # An independent review found the previous version interpolated
      # inputs.* directly into run: scripts -- GitHub Actions performs plain
      # text substitution of ${{ }} expressions before bash ever sees the
      # script, so an input containing shell metacharacters (e.g. a
      # command substitution) would execute with this workflow's Azure
      # permissions. Confirmed live with a harmless probe input containing
      # $(...) before this fix. Anyone who can dispatch this workflow can
      # already deploy arbitrary container images into this resource group,
      # so this is defense-in-depth against a future access-scope change,
      # not a response to an active anonymous-attacker path.
      RESOURCE_GROUP: ${{ inputs.resource_group }}
      AZURE_OPENAI_ACCOUNT_NAME: ${{ inputs.azure_openai_account_name }}
      AZURE_OPENAI_TEXT_DEPLOYMENT: ${{ inputs.azure_openai_text_deployment }}
      AZURE_OPENAI_VISION_DEPLOYMENT: ${{ inputs.azure_openai_vision_deployment }}
      NAME_PREFIX: ${{ inputs.name_prefix }}
      # workflow_dispatch input defaults can't reference expressions like
      # github.sha directly, so the fallback lives here instead.
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
      DATABASE_URL: ${{ inputs.database_url }}
      ALLOW_DISABLING_PERSISTENCE: ${{ inputs.allow_disabling_persistence }}
    steps:
      - uses: actions/checkout@v4

      # OIDC federated login: no client secret is stored anywhere in this
      # repository, matching this milestone's Managed-Identity-only
      # invariant (SPEC-M3 §7) at the CI/CD layer too. The federated
      # credential trusting this workflow must be set up once, out-of-band,
      # by whoever owns the target subscription. Its OIDC token subject
      # includes GitHub's immutable org/repo numeric IDs
      # (repo:org@id/repo@id:ref:...), not just names -- found live the
      # first time this workflow actually ran (D-012).
      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Refuse to deploy at all if the requested model deployments don't
      # exist, instead of letting Bicep silently fall back to a default
      # that doesn't -- this is the direct fix for the incident above.
      - name: Verify the requested Azure OpenAI deployments exist
        run: |
          set -euo pipefail
          existing=$(az cognitiveservices account deployment list \
            --name "$AZURE_OPENAI_ACCOUNT_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "[].name" -o tsv)
          echo "Existing deployments on $AZURE_OPENAI_ACCOUNT_NAME:"
          echo "$existing"
          for wanted in "$AZURE_OPENAI_TEXT_DEPLOYMENT" "$AZURE_OPENAI_VISION_DEPLOYMENT"; do
            if ! grep -qxF "$wanted" <<< "$existing"; then
              echo "::error::Deployment '$wanted' does not exist on $AZURE_OPENAI_ACCOUNT_NAME. Refusing to deploy Container Apps pointed at a model that isn't there."
              exit 1
            fi
          done

      - name: Deploy platform prerequisites (registry, identity, monitoring, role assignments)
        id: platform
        run: |
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/bicep/platform.bicep \
            --parameters namePrefix="$NAME_PREFIX" \
                         azureOpenAiAccountName="$AZURE_OPENAI_ACCOUNT_NAME" \
            --query properties.outputs -o json > platform-outputs.json
          cat platform-outputs.json
          echo "acr_login_server=$(jq -r .acrLoginServer.value platform-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "acr_name=$(jq -r .acrName.value platform-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "identity_id=$(jq -r .identityId.value platform-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "identity_client_id=$(jq -r .identityClientId.value platform-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "web_identity_id=$(jq -r .webIdentityId.value platform-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "web_identity_client_id=$(jq -r .webIdentityClientId.value platform-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "log_analytics_name=$(jq -r .logAnalyticsName.value platform-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "app_insights_connection_string=$(jq -r .appInsightsConnectionString.value platform-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "azure_openai_endpoint=$(jq -r .azureOpenAiEndpoint.value platform-outputs.json)" >> "$GITHUB_OUTPUT"

      # `az acr build` (ACR Tasks / cloud build) is used by default on a lot
      # of tutorials, but new subscriptions often have it blocked outright
      # (TasksOperationsNotAllowed -- an anti-abuse restriction, found live
      # during SPEC-M3's manual deployment). ubuntu-latest runners are
      # amd64 already (Azure Container Apps doesn't run arm64), so a plain
      # local `docker build` + push needs no cross-platform flag here,
      # unlike the Apple Silicon dev machine this was first deployed from.
      - name: Log in to the registry (az acr login)
        run: az acr login --name "${{ steps.platform.outputs.acr_name }}"

      - name: Build and push API image
        run: |
          docker build -f apps/api/Dockerfile \
            -t "${{ steps.platform.outputs.acr_login_server }}/armie-api:$IMAGE_TAG" \
            .
          docker push "${{ steps.platform.outputs.acr_login_server }}/armie-api:$IMAGE_TAG"

      - name: Build and push web image
        run: |
          docker build -f apps/web/Dockerfile \
            -t "${{ steps.platform.outputs.acr_login_server }}/armie-web:$IMAGE_TAG" \
            .
          docker push "${{ steps.platform.outputs.acr_login_server }}/armie-web:$IMAGE_TAG"

      # Independent-review fix: a routine redeploy that simply left
      # database_url blank (e.g. a caller who forgot it was ever set)
      # previously reverted a persistence-enabled API straight back to
      # in-memory/JSONL mode with no warning at all -- conversations/audit
      # from that point on would be silently non-durable again, while the
      # old Postgres data (and its cost) kept sitting there unused. This
      # step queries what the *currently deployed* API app actually has
      # configured and refuses to proceed if that would be a silent
      # downgrade, mirroring the existing "verify the model deployments
      # exist" pre-flight check's shape (fail closed, not fail quiet).
      - name: Refuse to silently disable persistence on a redeploy
        run: |
          set -euo pipefail
          current=$(az containerapp show \
            --name "${NAME_PREFIX}-api" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.template.containers[0].env[?name=='DATABASE_URL'].value | [0]" \
            -o tsv 2>/dev/null || true)
          if [ -n "$current" ] && [ "$current" != "None" ] && [ -z "$DATABASE_URL" ] && [ "$ALLOW_DISABLING_PERSISTENCE" != "yes" ]; then
            echo "::error::The currently deployed ${NAME_PREFIX}-api has DATABASE_URL set (persistence enabled), but this run's database_url input is blank. Refusing to silently revert conversations/audit to in-memory/JSONL mode. Pass the existing (or a new) database_url to keep persistence enabled, or set allow_disabling_persistence=yes if this downgrade is actually intentional."
            exit 1
          fi

      - name: Deploy Container Apps
        id: apps
        run: |
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/bicep/apps.bicep \
            --parameters namePrefix="$NAME_PREFIX" \
                         acrLoginServer="${{ steps.platform.outputs.acr_login_server }}" \
                         identityId="${{ steps.platform.outputs.identity_id }}" \
                         identityClientId="${{ steps.platform.outputs.identity_client_id }}" \
                         webIdentityId="${{ steps.platform.outputs.web_identity_id }}" \
                         logAnalyticsName="${{ steps.platform.outputs.log_analytics_name }}" \
                         appInsightsConnectionString="${{ steps.platform.outputs.app_insights_connection_string }}" \
                         azureOpenAiEndpoint="${{ steps.platform.outputs.azure_openai_endpoint }}" \
                         azureOpenAiTextDeployment="$AZURE_OPENAI_TEXT_DEPLOYMENT" \
                         azureOpenAiVisionDeployment="$AZURE_OPENAI_VISION_DEPLOYMENT" \
                         apiImage="${{ steps.platform.outputs.acr_login_server }}/armie-api:$IMAGE_TAG" \
                         webImage="${{ steps.platform.outputs.acr_login_server }}/armie-web:$IMAGE_TAG" \
                         databaseUrl="$DATABASE_URL" \
            --query properties.outputs -o json > apps-outputs.json
          cat apps-outputs.json
          echo "web_app_fqdn=$(jq -r .webAppFqdn.value apps-outputs.json)" >> "$GITHUB_OUTPUT"

      # Directly answers an independent review's finding that a prior
      # deployment "succeeded" while the model-backed answer path was
      # actually broken (wrong deployment name) and nothing noticed. Both
      # the deterministic (zero-model-call) and the semantic (real model
      # call) paths are exercised; the workflow fails if either does not
      # come back "answered" or "clarification_required" (a "clarification"
      # is a legitimate, non-broken outcome; "error" is not).
      - name: Post-deploy smoke test (deterministic path AND real model path)
        run: |
          set -euo pipefail
          base="https://${{ steps.apps.outputs.web_app_fqdn }}"
          echo "Smoke-testing $base"

          deterministic=$(curl -sf -X POST "$base/api/v1/chat" -H "Content-Type: application/json" \
            -d '{"question": "How many doors are in this project?"}')
          echo "$deterministic" | jq .
          disposition=$(echo "$deterministic" | jq -r .disposition)
          if [ "$disposition" != "answered" ]; then
            echo "::error::Deterministic smoke question returned disposition=$disposition, expected answered"
            exit 1
          fi

          semantic=$(curl -sf -X POST "$base/api/v1/chat" -H "Content-Type: application/json" \
            -d '{"question": "Please describe the situation with the doors in this project in your own words."}')
          echo "$semantic" | jq .
          disposition=$(echo "$semantic" | jq -r .disposition)
          if [ "$disposition" = "error" ]; then
            echo "::error::Model-backed smoke question returned disposition=error -- the Azure OpenAI path is broken (check the deployment names actually exist and match what was just verified above)."
            exit 1
          fi

      # Only meaningful once a Postgres data tier has been deployed
      # separately and DATABASE_URL was passed in (see that input's
      # description above) -- proves conversation context actually round-
      # trips through the configured ConversationStore via the real running
      # app. This does not restart the Container App mid-test to prove
      # cross-*process* durability the way tests/test_postgres_persistence.py
      # does directly against Postgres; doing that safely inside a workflow
      # run needs its own design (SPEC-M4's acceptance criteria calls that
      # out as a manual verification step, not an automated one, for now).
      - name: Post-deploy smoke test (conversation persistence, only if DATABASE_URL is set)
        if: ${{ inputs.database_url != '' }}
        run: |
          set -euo pipefail
          base="https://${{ steps.apps.outputs.web_app_fqdn }}"
          thread_id="smoke-test-$(date +%s)"

          first=$(curl -sf -X POST "$base/api/v1/chat" -H "Content-Type: application/json" \
            -d "{\"thread_id\": \"$thread_id\", \"question\": \"How many doors are on Level 01?\"}")
          echo "$first" | jq .
          disposition=$(echo "$first" | jq -r .disposition)
          if [ "$disposition" != "answered" ]; then
            echo "::error::First question on a fresh thread_id returned disposition=$disposition, expected answered -- this must pass before the follow-up question can prove anything about context persistence."
            exit 1
          fi

          second=$(curl -sf -X POST "$base/api/v1/chat" -H "Content-Type: application/json" \
            -d "{\"thread_id\": \"$thread_id\", \"question\": \"And how many on Level 02?\"}")
          echo "$second" | jq .
          disposition=$(echo "$second" | jq -r .disposition)
          # Independent-review fix: this previously only checked
          # disposition != "error", which a response with no actual
          # inherited context (e.g. "clarification_required: which
          # project/level?") would also satisfy -- passing this smoke test
          # without proving conversation context round-tripped through the
          # configured ConversationStore at all. This fixture's door count
          # is exactly 2 on Level 01 and 2 on Level 02
          # (tests/test_reconciliation.py's ground-truth fixture data) --
          # require both the honest "answered" disposition AND that digit
          # actually appearing, so a response that silently lost the
          # "Level 02" context (or the door/count intent it depends on)
          # cannot pass by only avoiding the word "error".
          answer=$(echo "$second" | jq -r .answer_markdown)
          if [ "$disposition" != "answered" ] || ! grep -q "2" <<< "$answer"; then
            echo "::error::Follow-up question on the same thread_id returned disposition=$disposition (expected answered) or an answer that does not contain the expected count (2): $answer -- conversation context likely did not round-trip through the configured ConversationStore."
            exit 1
          fi

      - name: Print deployment summary
        run: |
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Web app: https://${{ steps.apps.outputs.web_app_fqdn }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Smoke test: deterministic path answered, model path did not error" >> "$GITHUB_STEP_SUMMARY"
